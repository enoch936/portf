<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1040;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g opacity="0.15" font-family="monospace" font-size="12" fill="#8b5cf6">
    <text x="60" y="80">fn analyze_code(ast: &amp;SyntaxTree) -&gt; Vec&lt;Issue&gt; {</text>
    <text x="80" y="100">let issues = scanner.scan(ast);</text>
    <text x="80" y="120">let fixes = ai.suggest_fixes(&amp;issues);</text>
    <text x="60" y="140">}</text>
  </g>
  <text x="400" y="430" text-anchor="middle" font-family="system-ui" font-size="14" fill="#64748b">AI Code Analysis Studio</text>
</svg>
